name: Update learning log

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update log
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          echo "$DATE — reviewed notes, continued roadmap" >> learning-log.md
          
      - name: Commit
        run: |
          git config --local user.email "leelaprasath-cmd@users.noreply.github.com"
          git config --local user.name "leelaprasath-cmd"
          git add learning-log.md
          DATE=$(date -u +"%Y-%m-%d")
          git diff --cached --quiet || git commit -m "notes: $DATE"
          git push
