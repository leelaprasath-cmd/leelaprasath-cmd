<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="goldCyanFlow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#D4AF37"/>
      <animate attributeName="x1" values="0%; -100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF0A8"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>
  <text x="400" y="80" font-family="'Georgia', serif" font-size="22" font-weight="bold" fill="url(#goldCyanFlow)" text-anchor="middle" letter-spacing="14">
    BUILDING THE FUTURE
  </text>
</svg>