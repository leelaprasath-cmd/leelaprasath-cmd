<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="quantumFlow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="25%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#0055FF"/>
      <stop offset="75%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#0055FF"/>
      <animate attributeName="x1" values="0%; -100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#0033CC"/>
    </linearGradient>
  </defs>
  <text x="400" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#quantumFlow)" text-anchor="middle" letter-spacing="14">
    BUILDING THE FUTURE
  </text>
</svg>