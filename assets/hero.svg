<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cinematic Spotlight Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14110b"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Highly Reflective Flowing Gold Gradient -->
    <linearGradient id="reflectiveGold" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#9C6F1C"/>
      <stop offset="20%" stop-color="#F9E596"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F9E596"/>
      <stop offset="50%" stop-color="#9C6F1C"/>
      <stop offset="70%" stop-color="#F9E596"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F9E596"/>
      <stop offset="100%" stop-color="#9C6F1C"/>
      <animate attributeName="x1" values="0%; -100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="3s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- Outer Glow for the Text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rectangle -->
  <rect width="800" height="250" fill="url(#bgGlow)" rx="15"/>

  <!-- Layer 1: Slow drift up-left -->
  <g stroke="#D4AF37" stroke-width="0.5" fill="#D4AF37">
    <animateTransform attributeName="transform" type="translate" values="0,0; -15,-10; 5,5; 0,0" dur="18s" repeatCount="indefinite" />
    <g opacity="0.4">
      <animate attributeName="opacity" values="0.1; 0.5; 0.1" dur="5s" repeatCount="indefinite" />
      <line x1="100" y1="50" x2="200" y2="150"/>
      <line x1="100" y1="50" x2="350" y2="80"/>
      <circle cx="100" cy="50" r="2.5"/>
      <circle cx="200" cy="150" r="3"/>
      <circle cx="350" cy="80" r="2"/>
    </g>
    <g opacity="0.3">
      <animate attributeName="opacity" values="0.05; 0.3; 0.05" dur="7s" repeatCount="indefinite" />
      <line x1="650" y1="60" x2="750" y2="140"/>
      <line x1="650" y1="60" x2="550" y2="100"/>
      <circle cx="650" cy="60" r="2.5"/>
      <circle cx="750" cy="140" r="2.5"/>
      <circle cx="550" cy="100" r="2"/>
    </g>
  </g>

  <!-- Layer 2: Medium drift down-right -->
  <g stroke="#D4AF37" stroke-width="0.5" fill="#D4AF37">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,15; -5,-10; 0,0" dur="25s" repeatCount="indefinite" />
    <g opacity="0.5">
      <animate attributeName="opacity" values="0.2; 0.6; 0.2" dur="4s" repeatCount="indefinite" />
      <line x1="200" y1="150" x2="150" y2="220"/>
      <line x1="150" y1="220" x2="50" y2="180"/>
      <line x1="200" y1="150" x2="50" y2="180"/>
      <circle cx="150" cy="220" r="2"/>
      <circle cx="50" cy="180" r="1.5"/>
    </g>
    <g opacity="0.4">
      <animate attributeName="opacity" values="0.1; 0.4; 0.1" dur="6s" repeatCount="indefinite" />
      <line x1="750" y1="140" x2="720" y2="220"/>
      <line x1="550" y1="100" x2="600" y2="200"/>
      <line x1="600" y1="200" x2="720" y2="220"/>
      <circle cx="720" cy="220" r="1.5"/>
      <circle cx="600" cy="200" r="2"/>
    </g>
  </g>

  <!-- Layer 3: Fast drift up-right (Interconnections) -->
  <g stroke="#D4AF37" stroke-width="0.3" fill="#D4AF37">
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,-20; -15,10; 0,0" dur="15s" repeatCount="indefinite" />
    <g opacity="0.2">
      <animate attributeName="opacity" values="0.05; 0.25; 0.05" dur="3s" repeatCount="indefinite" />
      <line x1="200" y1="150" x2="300" y2="210"/>
      <line x1="350" y1="80" x2="400" y2="40"/>
      <line x1="550" y1="100" x2="400" y2="40"/>
      <line x1="600" y1="200" x2="480" y2="230"/>
      <line x1="300" y1="210" x2="480" y2="230"/>
      <circle cx="300" cy="210" r="2"/>
      <circle cx="400" cy="40" r="1.5"/>
      <circle cx="480" cy="230" r="1.5"/>
    </g>
  </g>

  <!-- Floating Data Particles -->
  <g fill="#F3E5AB" font-family="'Courier New', monospace" font-size="14" font-weight="bold">
    <animateTransform attributeName="transform" type="translate" values="0,50; 0,-50; 0,50" dur="20s" repeatCount="indefinite" />
    <text x="80" y="150" opacity="0">01<animate attributeName="opacity" values="0; 0.25; 0" dur="8s" repeatCount="indefinite" /></text>
    <text x="180" y="220" opacity="0">&lt;/&gt;<animate attributeName="opacity" values="0; 0.2; 0" dur="12s" repeatCount="indefinite" /></text>
    <text x="280" y="100" opacity="0">{}<animate attributeName="opacity" values="0; 0.15; 0" dur="9s" repeatCount="indefinite" /></text>
    <text x="450" y="80" opacity="0">AGI<animate attributeName="opacity" values="0; 0.3; 0" dur="10s" repeatCount="indefinite" /></text>
    <text x="580" y="190" opacity="0">10<animate attributeName="opacity" values="0; 0.2; 0" dur="11s" repeatCount="indefinite" /></text>
    <text x="680" y="110" opacity="0">{}<animate attributeName="opacity" values="0; 0.25; 0" dur="7s" repeatCount="indefinite" /></text>
    <text x="750" y="230" opacity="0">&lt;/&gt;<animate attributeName="opacity" values="0; 0.2; 0" dur="13s" repeatCount="indefinite" /></text>
  </g>

  <!-- Glowing Flowing Gradient Name -->
  <text x="400" y="130" font-family="'Georgia', serif" font-size="65" font-weight="bold" fill="url(#reflectiveGold)" text-anchor="middle" filter="url(#glow)" letter-spacing="6">
    LEELA PRASATH S
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="180" font-family="'Courier New', monospace" font-size="18" font-weight="normal" fill="#F3E5AB" text-anchor="middle" letter-spacing="8">
    AGENTIC AI ENGINEER
  </text>
</svg>