<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cinematic Spotlight Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f1a10"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Flowing Gold Gradient for Text -->
    <linearGradient id="flowingGold" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11"/>
      <stop offset="25%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
      <animate attributeName="x1" values="0%; -100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- Outer Glow for the Text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rectangle -->
  <rect width="800" height="250" fill="url(#bgGlow)" rx="15"/>

  <!-- Glowing Flowing Gradient Name -->
  <text x="400" y="130" font-family="'Georgia', serif" font-size="65" font-weight="bold" fill="url(#flowingGold)" text-anchor="middle" filter="url(#glow)" letter-spacing="6">
    LEELA PRASATH S
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="180" font-family="'Courier New', monospace" font-size="18" font-weight="normal" fill="#F3E5AB" text-anchor="middle" letter-spacing="8">
    AGENTIC AI ENGINEER
  </text>
</svg>