<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="goldCyanFlow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#D4AF37"/>
      <animate attributeName="x1" values="0%; -100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Cinematic Spotlight Background -->
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14110b" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF0A8"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#332912"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#332912"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#332912"/>
      <animate attributeName="x1" values="0%; -100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%; 100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card with Moving Gradient Border -->
  <rect x="50" y="50" width="700" height="150" fill="url(#cardGlow)" stroke="url(#goldCyanFlow)" stroke-width="1.5" rx="12"/>

  <!-- Futuristic Corner Brackets (Top Left) -->
  <path d="M 50 70 L 50 50 L 70 50" fill="none" stroke="#00F2FE" stroke-width="2" />
  <!-- Futuristic Corner Brackets (Bottom Right) -->
  <path d="M 750 180 L 750 200 L 730 200" fill="none" stroke="#00F2FE" stroke-width="2" />
  <!-- Futuristic Corner Brackets (Top Right) -->
  <path d="M 730 50 L 750 50 L 750 70" fill="none" stroke="#00F2FE" stroke-width="2" />
  <!-- Futuristic Corner Brackets (Bottom Left) -->
  <path d="M 70 200 L 50 200 L 50 180" fill="none" stroke="#00F2FE" stroke-width="2" />

  <!-- Animated Scanner Line inside the card -->
  <line x1="55" y1="55" x2="745" y2="55" stroke="#00F2FE" stroke-width="0.5" opacity="0.4" filter="url(#glow)">
    <animate attributeName="y1" values="55; 195; 55" dur="6s" repeatCount="indefinite" />
    <animate attributeName="y2" values="55; 195; 55" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1; 0.6; 0.1" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Section Title -->
  <text x="400" y="30" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="url(#goldCyanFlow)" text-anchor="middle" letter-spacing="8">
    // INTRODUCTION
  </text>

  <!-- Quote -->
  <text x="400" y="90" font-family="'Georgia', serif" font-style="italic" font-size="20" fill="#F3E5AB" text-anchor="middle" opacity="0.9" letter-spacing="1">
    "Ship fast, learn faster. Build systems that think."
  </text>

  <!-- Decorative Separator -->
  <line x1="300" y1="120" x2="500" y2="120" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  <circle cx="400" cy="120" r="3" fill="#FFF0A8" filter="url(#glow)"/>

  <!-- Profile Details -->
  <text x="400" y="150" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="url(#goldCyanFlow)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">
    LEELA PRASATH S
  </text>

  <text x="400" y="180" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#a3a3a3" text-anchor="middle" letter-spacing="2">
    BASED IN CHENNAI, INDIA 🇮🇳 &#160;|&#160; BE CSE STUDENT &#38; FULL STACK ARCHITECT
  </text>
</svg>